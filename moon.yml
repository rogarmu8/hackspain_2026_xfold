$schema: "https://moonrepo.dev/schemas/project.json"

id: xfold
language: bash
layer: tool

tasks:
  setup:
    script: |
      . ./scripts/pixi-path.sh
      pixi install
      eval "$(pixi shell-hook)"
      npm install
    options:
      cache: false
      runFromWorkspaceRoot: true
  install-mujoco:
    script: |
      . ./scripts/pixi-path.sh
      pixi install -e mujoco
    options:
      cache: false
      runFromWorkspaceRoot: true
  # Live stack: bridge (:8765) + dashboard (:3000) in one process group.
  # MuJoCo window stays separate (`moon run sim:view`) — Cocoa/mjpython.
  dev:
    command: "noop"
    deps:
      - sim:bridge
      - dashboard:dev
    preset: server
    options:
      persistent: true
      cache: false
      runFromWorkspaceRoot: true
  # The same stack on Isaac Sim: bridge on the GPU box (tunnelled to :8766)
  # + dashboard on :3001. Box settings in .env (see .env.example).
  dev-isaac:
    command: "noop"
    deps:
      - isaac:bridge
      - dashboard:dev-isaac
    preset: server
    options:
      persistent: true
      cache: false
      runFromWorkspaceRoot: true
  pack:
    extends: dev
