$schema: "https://moonrepo.dev/schemas/project.json"

id: xfold
language: bash
layer: tool

tasks:
  setup:
    script: |
      . ./scripts/pixi-path.sh
      pixi install
      eval "$(pixi shell-hook)"
      npm install
    options:
      cache: false
      runFromWorkspaceRoot: true
  install-mujoco:
    script: |
      . ./scripts/pixi-path.sh
      pixi install -e mujoco
    options:
      cache: false
      runFromWorkspaceRoot: true
