[workspace]
name = "xfold"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]
version = "0.1.0"

[dependencies]
python = "3.12.*"
nodejs = "22.*"
pillow = ">=10.0"

[pypi-dependencies]
xfold-sim = { path = "src/sim", editable = true }
fastapi = ">=0.115"
uvicorn = { version = ">=0.32", extras = ["standard"] }
pydantic = ">=2.0"

[feature.mujoco.pypi-dependencies]
mujoco = ">=3.2"
mujoco-menagerie = "*"
mink = "*"
pillow = "*"

[environments]
default = { features = [], solve-group = "dev" }
mujoco = { features = ["mujoco"], solve-group = "dev" }
