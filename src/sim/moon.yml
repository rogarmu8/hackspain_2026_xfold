$schema: "https://moonrepo.dev/schemas/project.json"

id: sim
language: python
layer: application
stack: backend

tasks:
  mock:
    script: |
      . ./scripts/pixi-path.sh
      eval "$(pixi shell-hook)"
      # -P skips cwd on sys.path so the root stub xfold/ does not shadow src/sim
      python -P -m xfold.mock_cycle
    options:
      cache: false
      runFromWorkspaceRoot: true
  bridge:
    script: |
      . ./scripts/pixi-path.sh
      # Prefer mujoco env so /viewport/stream can render the cell 3D view.
      if pixi run -e mujoco python -P -c "import mujoco" >/dev/null 2>&1; then
        pixi run -e mujoco python -P -m xfold.bridge
      else
        eval "$(pixi shell-hook)"
        python -P -m xfold.bridge
      fi
    preset: server
    options:
      cache: false
      persistent: true
      runFromWorkspaceRoot: true
  # The shared plant stub (models/cell.xml): floor, bin, flex shirt. For
  # eyeballing shirt.xml on its own — the full line is `sim:run`.
  view:
    command: bash
    args:
      - ./scripts/run-mjpython.sh
      - -m
      - xfold.view
    options:
      cache: false
      persistent: true
      runFromWorkspaceRoot: true
  # The line: belt, press, folder, bagger (bag magazine + picker, mouth opener, tilting peel, seal station + label), belt 2, carton.
  # `command` (not `script`) so `moon run sim:run -- --garment tank` reaches Python.
  run:
    command: bash
    args:
      - ./scripts/run-mjpython.sh
      - -m
      - xfold.line
    options:
      cache: false
      persistent: true
      runFromWorkspaceRoot: true
  shirt-smoke:
    script: |
      . ./scripts/pixi-path.sh
      pixi run --environment mujoco python -P -m xfold.shirt_smoke
    options:
      cache: false
      runFromWorkspaceRoot: true
  shirt-play:
    command: bash
    args:
      - ./scripts/run-mjpython.sh
      - -m
      - xfold.shirt_play
    options:
      cache: false
      persistent: true
      runFromWorkspaceRoot: true
  shirt-shot:
    command: bash
    args:
      - ./scripts/run-mjpython.sh
      - -m
      - xfold.shirt_shot
      - --out
      - shots
    options:
      cache: false
      runFromWorkspaceRoot: true
