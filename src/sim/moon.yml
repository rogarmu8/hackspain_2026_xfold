$schema: "https://moonrepo.dev/schemas/project.json"

id: sim
language: python
layer: application
stack: backend

tasks:
  mock:
    script: |
      . ./scripts/pixi-path.sh
      eval "$(pixi shell-hook)"
      # -P skips cwd on sys.path so the root stub xfold/ does not shadow src/sim
      python -P -m xfold.mock_cycle
    options:
      cache: false
      runFromWorkspaceRoot: true
  bridge:
    script: |
      . ./scripts/pixi-path.sh
      # Prefer mujoco env so /viewport/stream can render the cell 3D view.
      if pixi run -e mujoco python -P -c "import mujoco" >/dev/null 2>&1; then
        pixi run -e mujoco python -P -m xfold.bridge
      else
        eval "$(pixi shell-hook)"
        python -P -m xfold.bridge
      fi
    preset: server
    options:
      cache: false
      persistent: true
      runFromWorkspaceRoot: true
  view:
    script: |
      . ./scripts/pixi-path.sh
      if [ "$(uname -s)" = Darwin ]; then
        pixi run --environment mujoco mjpython -P -m xfold.view
      else
        pixi run --environment mujoco python -P -m xfold.view
      fi
    options:
      cache: false
      persistent: true
      runFromWorkspaceRoot: true
  # The line: belt carries a flat shirt under the press, then onto the folder.
  run:
    script: |
      . ./scripts/pixi-path.sh
      if [ "$(uname -s)" = Darwin ]; then
        pixi run --environment mujoco mjpython -P -m xfold.line
      else
        pixi run --environment mujoco python -P -m xfold.line
      fi
    options:
      cache: false
      persistent: true
      runFromWorkspaceRoot: true
  shirt-smoke:
    script: |
      . ./scripts/pixi-path.sh
      pixi run --environment mujoco python -P -m xfold.shirt_smoke
    options:
      cache: false
      runFromWorkspaceRoot: true
  shirt-play:
    script: |
      . ./scripts/pixi-path.sh
      if [ "$(uname -s)" = Darwin ]; then
        pixi run --environment mujoco mjpython -P -m xfold.shirt_play
      else
        pixi run --environment mujoco python -P -m xfold.shirt_play
      fi
    options:
      cache: false
      persistent: true
      runFromWorkspaceRoot: true
  shirt-shot:
    script: |
      . ./scripts/pixi-path.sh
      pixi run --environment mujoco python -P -m xfold.shirt_shot --out shots
    options:
      cache: false
      runFromWorkspaceRoot: true
  shirt-play-hi:
    script: |
      . ./scripts/pixi-path.sh
      if [ "$(uname -s)" = Darwin ]; then
        pixi run --environment mujoco mjpython -P -m xfold.shirt_play --hi
      else
        pixi run --environment mujoco python -P -m xfold.shirt_play --hi
      fi
    options:
      cache: false
      persistent: true
      runFromWorkspaceRoot: true
  shirt-play-poncho:
    script: |
      . ./scripts/pixi-path.sh
      if [ "$(uname -s)" = Darwin ]; then
        pixi run --environment mujoco mjpython -P -m xfold.shirt_play --poncho
      else
        pixi run --environment mujoco python -P -m xfold.shirt_play --poncho
      fi
    options:
      cache: false
      persistent: true
      runFromWorkspaceRoot: true
