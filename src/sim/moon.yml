$schema: "https://moonrepo.dev/schemas/project.json"

id: sim
language: python
layer: application
stack: backend

tasks:
  mock:
    script: |
      . ./scripts/pixi-path.sh
      eval "$(pixi shell-hook)"
      python -m xfold.mock_cycle
    options:
      cache: false
      runFromWorkspaceRoot: true
  view:
    script: |
      . ./scripts/pixi-path.sh
      if [ "$(uname -s)" = Darwin ]; then
        pixi run --environment mujoco mjpython -m xfold.view
      else
        pixi run --environment mujoco python -m xfold.view
      fi
    options:
      cache: false
      persistent: true
      runFromWorkspaceRoot: true
  shirt-smoke:
    script: |
      . ./scripts/pixi-path.sh
      pixi run --environment mujoco python -m xfold.shirt_smoke
    options:
      cache: false
      runFromWorkspaceRoot: true
  shirt-play:
    script: |
      . ./scripts/pixi-path.sh
      if [ "$(uname -s)" = Darwin ]; then
        pixi run --environment mujoco mjpython -m xfold.shirt_play
      else
        pixi run --environment mujoco python -m xfold.shirt_play
      fi
    options:
      cache: false
      persistent: true
      runFromWorkspaceRoot: true
  shirt-shot:
    script: |
      . ./scripts/pixi-path.sh
      pixi run --environment mujoco python -m xfold.shirt_shot --out shots
    options:
      cache: false
      runFromWorkspaceRoot: true
  shirt-play-hi:
    script: |
      . ./scripts/pixi-path.sh
      if [ "$(uname -s)" = Darwin ]; then
        pixi run --environment mujoco mjpython -m xfold.shirt_play --hi
      else
        pixi run --environment mujoco python -m xfold.shirt_play --hi
      fi
    options:
      cache: false
      persistent: true
      runFromWorkspaceRoot: true
  shirt-play-poncho:
    script: |
      . ./scripts/pixi-path.sh
      if [ "$(uname -s)" = Darwin ]; then
        pixi run --environment mujoco mjpython -m xfold.shirt_play --poncho
      else
        pixi run --environment mujoco python -m xfold.shirt_play --poncho
      fi
    options:
      cache: false
      persistent: true
      runFromWorkspaceRoot: true
