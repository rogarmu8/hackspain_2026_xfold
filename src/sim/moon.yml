$schema: "https://moonrepo.dev/schemas/project.json"

id: sim
language: python
layer: application
stack: backend

tasks:
  mock:
    script: |
      . ./scripts/pixi-path.sh
      eval "$(pixi shell-hook)"
      python -m xfold.mock_cycle
    options:
      cache: false
      runFromWorkspaceRoot: true
  view:
    script: |
      . ./scripts/pixi-path.sh
      if [ "$(uname -s)" = Darwin ]; then
        pixi run --environment mujoco mjpython -m xfold.view
      else
        pixi run --environment mujoco python -m xfold.view
      fi
    options:
      cache: false
      persistent: true
      runFromWorkspaceRoot: true
